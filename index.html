<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>


<div class="controls regions">
  <input type="radio" name="region" id="rIDF" checked>
  <label for="rIDF">Île-de-France</label>

  <input type="radio" name="region" id="rARA">
  <label for="rARA">ARA</label>

  <input type="radio" name="region" id="rC">
  <label for="rC">Corse</label>
</div>


<div class="controls years">
  <input type="radio" name="year" id="y2014" checked>
  <label for="y2014">2014</label>

  <input type="radio" name="year" id="y2015">
  <label for="y2015">2015</label>

  <input type="radio" name="year" id="y2025">
  <label for="y2025">2025</label>
</div>


<div class="graphs">

  
  <div class="region rIDF">

    
    <img src="Graphique/IDF.webp">
    <img src="Graphique/Prod_an_IDF.png">

    
    <img src="Graphique/Prod_mens_IDF_2023.png" class="year y2014">
    <img src="Graphique/Prod_mens_IDF_2024.png" class="year y2015">
    <img src="Graphique/Prod_mens_IDF_2025.png" class="year y2025">
  </div>


  <div class="region rARA">

    <img src="Graphique/ARA.webp">

    <img src="Graphique/ARA_2014.webp" class="year y2014">
    <img src="Graphique/ARA_2015.webp" class="year y2015">
    <img src="Graphique/ARA_2025.webp" class="year y2025">
  </div>

  
  <div class="region rC">

    <img src="Graphique/C.webp">

    <img src="Graphique/C_2014.webp" class="year y2014">
    <img src="Graphique/C_2015.webp" class="year y2015">
    <img src="Graphique/C_2025.webp" class="year y2025">
  </div>

</div>

</body>
</html>
