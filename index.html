<div class="region-selector">

  <input type="radio" name="région" id="rARA" checked>
  <label for="rARA">Auvergne Rhone Alpe</label>

  <input type="radio" name="région" id="rC" checked>

  <input type="radio" name="région" id="rBFC" checked>

  <div class="graphs">
