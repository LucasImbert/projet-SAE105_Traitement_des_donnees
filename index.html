
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>SAE E105 – Part des renouvelables par région</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Part des énergies renouvelables par région</h1>
    <p>Choisis une année pour afficher le graphique.</p>
  </header>

  <section class="controls">
    <!-- Boutons années -->
    <div class="buttons">
      <button data-year="2022">2022</button>
      <button data-year="2023" class="active">2023</button>
      <button data-year="2024">2024</button>
      <button data-year="2025">2025</button>
    </div>

    <!-- (Option) Menu déroulant si tu préfères -->
    <label for="yearSelect">Année :</label>
    <select id="yearSelect">
      <option value="2022">2022</option>
      <option value="2023" selected>2023</option>
      <option value="2024">2024</option>
      <option value="2025">2025</option>
    </select>
  </section>

  <main>
    <figure>
      <img id="chartImage"
           src="figures/stacked_renouvelables_regions_2023.png"
           alt="Graphique renouvelables par région (2023)">
      <figcaption id="caption">Graphique – Année 2023</figcaption>
    </figure>
  </main>

  <footer>
    <small>Sources : graphiques générés en Python (matplotlib), données publiques RTE.</small>
  </footer>

  <script src="app.js"></script>
</body>
</html>
