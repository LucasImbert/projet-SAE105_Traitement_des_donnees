
<!DOCTYPE html>

  <title>Régions & Années Graphiques</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css">
</head>
<body>


  <input type="radio" name="region" id="rIDF" checked>
  <input type="radio" name="region" id="rARA">
  <input type="radio" name="region" id="rC">
  <input type="radio" name="region" id="rBRE">
