<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="region-selector">

  <input type="radio" name="region" id="rIDF" checked>
  <label for="rIDF">Ile de France</label>

  <input type="radio" name="region" id="rARA">
  <label for="rARA">Auvergne Rhone Alpe</label>

  <input type="radio" name="region" id="rC">
  <label for="rC">Corse</label>

  <input type="radio" name="region" id="rBFC">
  <label for="rBFC">Bourgogne Franche Comte</label>

  <div class="graphs">
    <img src="Graphique/IDF.webp" class="gIDF">
    <img src="Graphique/ARA.webp" class="gARA">
    <img src="Graphique/C.webp" class="gC">
    <img src="Graphique/BFC.webp" class="gBFC">
  </div>

</div>

</body>

</html>
